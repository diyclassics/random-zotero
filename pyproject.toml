[project]
name = "random-zotero"
version = "0.1.0"
description = "Wireframe Flask app that displays a random entry from a Zotero library."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
authors = [
    { name = "Patrick J. Burns" },
]
dependencies = [
    "flask>=3.1,<4",
    "gunicorn>=23.0",
    "pyzotero>=1.5",
    "requests>=2.32",
]

[tool.uv]
package = false
