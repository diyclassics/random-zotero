<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Random Zotero</title>
    <meta name="description" content="A random entry from the Annotated Bibliography of Digital Classics, a public Zotero group library." />
  </head>
  <body>
    <main>
      <header>
        <h1><a href=".">Random Zotero</a></h1>
        <a class="nav" href="v0/">Original version</a>
      </header>
      <p class="intro">
        This site randomly pulls a bibliographic entry from a Zotero library.
        For this demo, we have used the public
        <a href="https://www.zotero.org/groups/625742/annotated_bibliography_of_digital_classics" target="_blank" rel="noopener">Annotated Bibliography of Digital Classics</a>
        library with the id <span class="id">625742</span>.
      </p>
      <div id="citation" class="citation" aria-live="polite">Loading…</div>
      <div class="actions">
        <button id="reroll" type="button" class="reroll" aria-label="Random again">↻</button>
      </div>
      <footer>
        Developed by <a href="https://diyclassics.github.io" rel="noopener">Patrick J. Burns</a> and Joseph Hartnett.
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
