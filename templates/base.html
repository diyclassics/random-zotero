<!doctype html>
<html>
  <head>
    {% block head %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
      <title>Random Zotero Item {% block title %}{% endblock %}</title>
    {% endblock %}
  </head>
  <body>
    <div class="container">
        <div id="content">
            {% block content %}{% endblock %}
        </div>
        <div id="footer">
          {% block footer %}
          <br><br>Developed by <a href="http://diyclassics.github.io">Patrick J. Burns</a>.
          {% endblock %}
        </div>
    </div>
  </body>
</html>
